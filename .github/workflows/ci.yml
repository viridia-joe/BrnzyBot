name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]   # master pushes go straight to deploy.yml

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # must match the Docker base image

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (catches 3.11 syntax errors before deploy)
        run: python -m compileall -q .

      - name: Import-check deterministic modules
        env:
          ENABLE_LLM: "false"
        run: |
          python - <<'PY'
          import importlib
          # These must import and run with no model and no live services.
          mods = [
              "config",
              "core.classifier",
              "core.node_health",
              "core.strategy_context",
              "core.strategy_handler",
              "core.general_handler",
              "core.bossguide_handler",
          ]
          for m in mods:
              importlib.import_module(m)

          import config
          assert config.ENABLE_LLM is False, "ENABLE_LLM should default false"

          # Deterministic fallbacks must not touch the network.
          from core.node_health import check_nodes
          assert check_nodes(post_alerts=False).available == {}, "node poll ran with LLM off"

          from core.classifier import classify
          assert classify("gearprio brnz 3", source="prefix").command == "gearprio"
          assert classify("what's the best trinket?", source="nl").command == "unknown"

          from core.general_handler import handle_general_question
          assert "currently switched off" in handle_general_question("hi", guild_id="1")

          print("deterministic import-check OK")
          PY

      - name: Unit tests
        env:
          ENABLE_LLM: "false"
        run: |
          python tests/test_audit.py
          python tests/test_gear_offline.py
          python tests/test_entitlements.py
          python tests/test_fight_diagrams.py
          python tests/test_rotation.py
          python tests/test_bossguide_data.py
          python tests/test_phase.py
          python tests/test_json_validity.py
          python tests/test_content_encoding.py
          python tests/test_healer_analysis.py
          python tests/test_srprio.py
          python tests/test_gearprio.py
          python tests/test_bis_equivalence.py
          python tests/test_item_restrictions.py
