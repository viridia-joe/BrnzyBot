name: Deploy to Jarvis

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - "data/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.JARVIS_SSH_KEY }}

      - name: Add Jarvis to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.JARVIS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Jarvis
        env:
          JARVIS_HOST: ${{ secrets.JARVIS_HOST }}
          JARVIS_USER: ${{ secrets.JARVIS_USER }}
        run: |
          ssh ${JARVIS_USER}@${JARVIS_HOST} '
            set -e
            cd ~/brnzybot
            git fetch origin master
            git reset --hard origin/master
            systemctl --user restart brnzybot
            echo "Deploy complete at $(date)"
          '

      - name: Verify health check
        env:
          JARVIS_HOST: ${{ secrets.JARVIS_HOST }}
          JARVIS_USER: ${{ secrets.JARVIS_USER }}
        run: |
          sleep 5
          ssh ${JARVIS_USER}@${JARVIS_HOST} 'curl -sf http://localhost:8081/health'
