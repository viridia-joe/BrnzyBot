name: Deploy to GCE

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:   # allow manual deploys from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}

      - name: Add GCE host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.GCE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ secrets.GCE_USER }}
        run: |
          ssh ${GCE_USER}@${GCE_HOST} '
            set -e

            # First-time setup: clone the repo if it is not already a git repo
            if [ ! -d ~/brnzybot-git/.git ]; then
              rm -rf ~/brnzybot-git
              git clone https://github.com/viridia-joe/BrnzyBot.git ~/brnzybot-git
            fi

            cd ~/brnzybot-git
            git fetch origin master
            git reset --hard origin/master

            # Restore secrets file (lives outside repo, survives deploys)
            if [ ! -f ~/brnzybot.env ]; then
              echo "ERROR: ~/brnzybot.env is missing on the VM. Create it with the"
              echo "required secrets (see .env.example) before deploying."
              exit 1
            fi
            cp ~/brnzybot.env ~/brnzybot-git/.env

            # Deterministic mode (default): only the bot is built/started. To run
            # the optional LLM proxy, set ENABLE_LLM=true and use --profile llm.
            docker compose up --build -d
            echo "Deploy complete at $(date)"
          '

      - name: Verify health
        env:
          GCE_HOST: ${{ secrets.GCE_HOST }}
          GCE_USER: ${{ secrets.GCE_USER }}
        run: |
          sleep 15
          ssh ${GCE_USER}@${GCE_HOST} 'curl -sf http://localhost:8081/health && echo " bot OK"'
