services:

  # ── Discord bot ────────────────────────────────────────────────────────────
  brnzybot:
    build: .
    restart: unless-stopped
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=sk-brnzybot
      - MODEL_TRIAGE=gear-triage
    env_file:
      - .env
    volumes:
      - /home/brnz/openclaw-data:/root/.openclaw/data
      - /home/brnz/openclaw-logs:/root/.openclaw/logs
    depends_on:
      - litellm

  # ── LiteLLM proxy — routes model aliases to Claude API ───────────────────
  # gear-triage / gear-generator / gear-critic → Claude Haiku (cheap, fast)
  # gear-escalation → Claude Sonnet (smart)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command: --config /app/litellm_config.yaml --port 4000 --host 0.0.0.0
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    env_file:
      - .env
