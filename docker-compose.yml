services:

  # ── Discord bot ────────────────────────────────────────────────────────────
  brnzybot:
    build: .
    restart: unless-stopped
    environment:
      # Master switch for the LLM layer. Default off → deterministic-only mode
      # (no litellm container needed). Set ENABLE_LLM=true in .env and start the
      # proxy with `docker compose --profile llm up -d` to enable conversation.
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=sk-brnzybot
      - MODEL_TRIAGE=gear-triage
      - HEALTH_PORT=${HEALTH_PORT:-8081}
    env_file:
      - .env
    # Publish the liveness endpoint so host-level checks (CI, UptimeRobot) and
    # `curl localhost:8081/health` actually reach the container.
    ports:
      - "${HEALTH_PORT:-8081}:${HEALTH_PORT:-8081}"
    volumes:
      - /home/brnz/openclaw-data:/root/.openclaw/data
      - /home/brnz/openclaw-logs:/root/.openclaw/logs
    # Stream container logs to GCP Cloud Logging.
    # Visible at: console.cloud.google.com → Logging → Log Explorer
    # Filter: resource.type="gce_instance" logName=~"brnzybot"
    logging:
      driver: gcplogs
      options:
        gcp-project: brnzybot-prod
        tag: brnzybot

  # ── LiteLLM proxy — routes model aliases to Claude API ──────────────────
  # Opt-in only: lives behind the "llm" compose profile so the default
  # `docker compose up` (deterministic mode) never builds/pulls this large
  # image. Enable with: docker compose --profile llm up -d
  # gear-triage / gear-generator / gear-critic → Claude Haiku (cheap, fast)
  # gear-escalation → Claude Sonnet (smart)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    profiles: ["llm"]
    command: --config /app/litellm_config.yaml --port 4000 --host 0.0.0.0
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    env_file:
      - .env
