# LiteLLM proxy configuration — GCP / cloud deployment
#
# Maps the model aliases used throughout brnzybot to real Claude API models.
# ANTHROPIC_API_KEY must be set in the .env file.
#
# Swap any model for a different Claude tier by editing `model:` below.
# Claude Haiku 4.5  = fast + cheap (triage, generation, critic)
# Claude Sonnet 4.6 = smart + capable (escalation, complex gear analysis)

model_list:

  - model_name: gear-triage
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gear-generator
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gear-critic
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gear-escalation
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  set_verbose: false
  drop_params: true   # silently drop any params a model doesn't support
